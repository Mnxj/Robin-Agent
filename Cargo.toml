[workspace]
members = [
    "crates/robin",
    "crates/robin-app",
    "crates/robin-internal",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["cloer"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
futures-util = "0.3"

# HTTP / WebSocket
axum = { version = "0.7", features = ["ws", "multipart"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "blocking", "rustls-tls-native-roots"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
hyper = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Markdown / terminal rendering
pulldown-cmark = "0.11"
crossterm = "0.27"
ratatui = "0.26"

# OAuth2
oauth2 = "4"

# File watching
notify = "6"

# SQLite
rusqlite = { version = "0.31", features = ["bundled"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls"] }

# OpenTelemetry
opentelemetry = "0.23"
opentelemetry_sdk = { version = "0.23", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.16", features = ["http-proto", "logs", "metrics"] }
opentelemetry-semantic-conventions = "0.15"
tracing = "0.1"
tracing-opentelemetry = "0.24"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID / ULID
uuid = { version = "1", features = ["v4"] }
ulid = "1"

# Regex
regex = "1"

# Chrono
chrono = { version = "0.4", features = ["serde"] }

# Cron scheduler
cron = "0.12"
tokio-cron-scheduler = "0.10"

# BM25 / vector search
tantivy = "0.21"

# Browser automation (chromedp equivalent)
headless_chrome = "1"

# Subprocess management
tokio-process = "0.2"

# Compression / encoding
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"

# Error handling
thiserror = "1"
anyhow = "1"

# Config parsing (JSON5)
json5 = "0.4"

# Logging
log = "0.4"
env_logger = "0.11"

# Miscellaneous
rand = "0.8"
url = "2"
mime = "0.3"
bytes = "1"
once_cell = "1"
parking_lot = "0.12"
dashmap = "5"
async-trait = "0.1"
pin-project = "1"
tokio-util = { version = "0.7", features = ["rt"] }
walkdir = "2"
which = "6"
dirs = "5"
humantime = "2"
libc = "0.2"